name: Monthly strategy optimizer

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download local-only history
        env:
          HY_SUPABASE_URL: ${{ secrets.HY_SUPABASE_URL }}
          HY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HY_SUPABASE_SERVICE_ROLE_KEY }}
          HY_DEFAULT_TIMEZONE: Asia/Shanghai
          HY_HISTORY_SYMBOLS: ${{ secrets.HY_HISTORY_SYMBOLS }}
          HY_HISTORY_DAYS: 400
          HY_HISTORY_TIMEFRAMES: 15m,1h,4h
          HY_OPTIMIZER_DATA_DIR: data/raw
        run: pnpm history:download
      - name: Run optimizer
        env:
          HY_SUPABASE_URL: ${{ secrets.HY_SUPABASE_URL }}
          HY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HY_SUPABASE_SERVICE_ROLE_KEY }}
          HY_DEFAULT_TIMEZONE: Asia/Shanghai
          HY_OPTIMIZER_DATA_DIR: data/raw
        run: pnpm optimizer
